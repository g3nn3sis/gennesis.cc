    <script>
        const entryScreen = document.getElementById('entryScreen');
        const mainContent = document.getElementById('mainContent');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');
        const bgAudio = document.getElementById('bgAudio');
        const audioToggle = document.getElementById('audioToggle');
        const audioIconOn = document.getElementById('audioIconOn');
        const audioIconOff = document.getElementById('audioIconOff');
        const audioSlider = document.getElementById('audioSlider');

        const songs = [
            'https://r2.gennesis.cc/89395cee6fa00b64.mp3',
            'https://r2.gennesis.cc/e04a764c77b8cb7c.mp3',
            'https://r2.gennesis.cc/6384738f8f24bc9e.mp3'
        ];

        let pendingUrl = null;
        let audioMuted = false;

        bgAudio.src = songs[Math.floor(Math.random() * songs.length)];

        function updateAudioIcon() {
            audioIconOn.style.display = audioMuted ? 'none' : 'block';
            audioIconOff.style.display = audioMuted ? 'block' : 'none';
            audioToggle.setAttribute('aria-label', audioMuted ? 'Unmute audio' : 'Mute audio');
            audioToggle.setAttribute('title', audioMuted ? 'Unmute' : 'Mute');
        }

        function enterSite() {
            entryScreen.classList.add('hidden');
            mainContent.classList.add('visible');
            bgAudio.muted = audioMuted;
            bgAudio.play().catch(err => {
                console.warn('Playback failed:', err);
            });
        }

        function showModal(url) {
            pendingUrl = url;
            modalOverlay.classList.add('visible');
            mainContent.classList.add('blurred');
        }

        function hideModal() {
            modalOverlay.classList.remove('visible');
            mainContent.classList.remove('blurred');
            pendingUrl = null;
        }

        function goToUrl() {
            if (pendingUrl) {
                window.open(pendingUrl, '_blank', 'noopener,noreferrer');
            }
            hideModal();
        }

        entryScreen.addEventListener('click', enterSite);
        entryScreen.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                enterSite();
            }
        });

        audioToggle.addEventListener('click', () => {
            audioMuted = !audioMuted;
            bgAudio.muted = audioMuted;
            updateAudioIcon();
        });

        audioSlider.addEventListener('input', () => {
            const vol = Number(audioSlider.value) / 100;
            bgAudio.volume = vol;
            audioMuted = vol === 0;
            bgAudio.muted = audioMuted;
            updateAudioIcon();
        });

        audioSlider.addEventListener('change', () => {
            audioSlider.blur();
        });

        audioSlider.addEventListener('mouseup', () => {
            audioSlider.blur();
        });

        audioSlider.addEventListener('touchend', () => {
            audioSlider.blur();
        });

        document.querySelectorAll('a[href^="http"]:not(.title-link), a[href^="mailto:"]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                showModal(link.href);
            });
        });

        modalConfirm.addEventListener('click', goToUrl);
        modalCancel.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideModal();
        });

        document.addEventListener('keydown', (e) => {
            if (modalOverlay.classList.contains('visible')) {
                if (e.key === 'Escape') hideModal();
                if (e.key === 'Enter') goToUrl();
            }
        });
    </script>

    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
